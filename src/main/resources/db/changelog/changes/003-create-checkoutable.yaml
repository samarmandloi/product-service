databaseChangeLog:
  - changeSet:
      id: 003-create-checkoutable
      author: samar
      changes:
        - createTable:
            tableName: checkoutable
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: brand_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: product_image
                  type: VARCHAR(500)

              - column:
                  name: checkoutable_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: checkoutable
            baseColumnNames: category_id
            referencedTableName: category
            referencedColumnNames: id
            constraintName: fk_checkoutable_category

        - addForeignKeyConstraint:
            baseTableName: checkoutable
            baseColumnNames: brand_id
            referencedTableName: brand
            referencedColumnNames: id
            constraintName: fk_checkoutable_brand

        - sql:
            sql: >
              ALTER TABLE checkoutable
              ADD CONSTRAINT chk_checkoutable_type
              CHECK (checkoutable_type IN ('PRODUCT', 'SAMPLE'));

        - sql:
            sql: >
              ALTER TABLE checkoutable
              ADD CONSTRAINT chk_checkoutable_price
              CHECK (price >= 0);