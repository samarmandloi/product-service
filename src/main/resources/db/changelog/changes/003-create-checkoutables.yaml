databaseChangeLog:

  - changeSet:
      id: 003-create-checkoutables
      author: samar

      changes:

        - createTable:
            tableName: checkoutables

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: brand_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: image_url
                  type: VARCHAR(1000)

              - column:
                  name: checkoutable_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: checkoutables
            baseColumnNames: brand_id
            referencedTableName: brands
            referencedColumnNames: id
            constraintName: fk_checkoutables_brand

        - sql:
            sql: >
              ALTER TABLE checkoutables
              ADD CONSTRAINT chk_checkoutables_type
              CHECK (checkoutable_type IN ('PRODUCT', 'SAMPLE'));

        - sql:
            sql: >
              ALTER TABLE checkoutables
              ADD CONSTRAINT chk_checkoutables_price
              CHECK (price >= 0);

      rollback:

        - dropTable:
            tableName: checkoutables