databaseChangeLog:
  - changeSet:
      id: 004-create-variant
      author: samar
      changes:
        - createTable:
            tableName: variant
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: variant_image
                  type: VARCHAR(500)

              - column:
                  name: original_price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: discounted_price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: variant
            baseColumnNames: product_id
            referencedTableName: checkoutable
            referencedColumnNames: id
            constraintName: fk_variant_product
            onDelete: CASCADE

        - sql:
            sql: >
              ALTER TABLE variant
              ADD CONSTRAINT chk_variant_original_price
              CHECK (original_price >= 0);

        - sql:
            sql: >
              ALTER TABLE variant
              ADD CONSTRAINT chk_variant_discounted_price
              CHECK (discounted_price >= 0);

        - sql:
            sql: >
              ALTER TABLE variant
              ADD CONSTRAINT chk_variant_price_order
              CHECK (discounted_price <= original_price);