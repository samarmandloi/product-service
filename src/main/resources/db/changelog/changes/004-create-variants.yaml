databaseChangeLog:

  - changeSet:
      id: 004-create-variants
      author: samar

      changes:

        - createTable:
            tableName: variants

            columns:

              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: checkoutable_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: sku
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: image_url
                  type: VARCHAR(1000)

              - column:
                  name: original_price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: discounted_price
                  type: NUMERIC(19,2)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueDate: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: variants
            baseColumnNames: checkoutable_id
            referencedTableName: checkoutables
            referencedColumnNames: id
            constraintName: fk_variants_checkoutable
            onDelete: CASCADE

        - sql:
            sql: >
              ALTER TABLE variants
              ADD CONSTRAINT chk_variants_original_price
              CHECK (original_price >= 0);

        - sql:
            sql: >
              ALTER TABLE variants
              ADD CONSTRAINT chk_variants_discounted_price
              CHECK (discounted_price >= 0);

        - sql:
            sql: >
              ALTER TABLE variants
              ADD CONSTRAINT chk_variants_discount
              CHECK (discounted_price <= original_price);

      rollback:

        - dropTable:
            tableName: variants